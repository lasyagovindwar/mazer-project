<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusAdmin — Sign In</title>

  <!-- Bootstrap 5 -->
   <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./assets/css/custom.css" />

  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .auth-hero {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 60%, #2dd4bf 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .auth-hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      top: -100px;
      right: -150px;
    }

    .auth-hero::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: -80px;
      left: -80px;
    }

    .auth-hero-content { position: relative; z-index: 1; text-align: center; }

    .auth-hero-logo {
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.2);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      backdrop-filter: blur(8px);
    }

    .auth-hero h1 { font-size: 36px; font-weight: 700; letter-spacing: -1px; margin-bottom: 12px; }
    .auth-hero p  { opacity: 0.8; font-size: 16px; max-width: 340px; margin: 0 auto; }

    .auth-stats {
      display: flex;
      gap: 40px;
      margin-top: 48px;
      padding-top: 40px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }

    .auth-stat-value { font-size: 26px; font-weight: 700; font-family: var(--font-mono); }
    .auth-stat-label { font-size: 12px; opacity: 0.7; margin-top: 2px; }

    .auth-form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px;
      background: var(--clr-bg);
    }

    .auth-form-box {
      width: 100%;
      max-width: 420px;
    }

    .auth-form-box h2 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--clr-text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      color: var(--clr-text);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      font-family: var(--font-base);
      transition: all var(--transition);
    }

    .form-control:focus {
      background: var(--clr-surface);
      color: var(--clr-text);
      border-color: var(--clr-primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    .btn-primary-custom {
      background: linear-gradient(135deg, var(--clr-primary), var(--clr-primary-dark));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      font-family: var(--font-base);
      transition: opacity var(--transition), transform var(--transition);
    }

    .btn-primary-custom:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary-custom:active { transform: translateY(0); }

    @media (max-width: 767.98px) {
      .auth-page { grid-template-columns: 1fr; }
      .auth-hero  { display: none; }
      .auth-form-panel { padding: 32px 24px; }
    }
  </style>
</head>
<body>

<div class="auth-page">
  <!-- Hero Panel -->
  <div class="auth-hero">
    <div class="auth-hero-content">
      <div class="auth-hero-logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <h1>NexusAdmin</h1>
      <p>The modern analytics dashboard built for teams who move fast and ship quality.</p>
      <div class="auth-stats">
        <div>
          <div class="auth-stat-value">24k+</div>
          <div class="auth-stat-label">Active Users</div>
        </div>
        <div>
          <div class="auth-stat-value">₹1.2Cr</div>
          <div class="auth-stat-label">Revenue Tracked</div>
        </div>
        <div>
          <div class="auth-stat-value">99.9%</div>
          <div class="auth-stat-label">Uptime</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Form Panel -->
  <div class="auth-form-panel">
    <div class="auth-form-box">
      <h2>Welcome back 👋</h2>
      <p class="text-muted mb-4" style="font-size:14px;">Sign in to access your dashboard.</p>

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" placeholder="admin@nexus.io" value="admin@nexus.io" />
      </div>

      <div class="mb-4">
        <label class="form-label d-flex justify-content-between">
          Password
          <a href="#" style="font-size:12px; color:var(--clr-primary); text-decoration:none;">Forgot password?</a>
        </label>
        <input type="password" class="form-control" placeholder="••••••••" value="password" />
      </div>

      <div class="d-flex align-items-center gap-2 mb-4">
        <input type="checkbox" id="remember" class="form-check-input m-0" />
        <label for="remember" class="form-label m-0" style="cursor:pointer;">Remember me for 30 days</label>
      </div>

      <a href="./dashboard.html" class="btn-primary-custom d-block text-center text-decoration-none">
        Sign in to Dashboard →
      </a>

      <p class="text-center text-muted mt-4" style="font-size:12px;">
        Don't have an account? <a href="#" style="color:var(--clr-primary);">Contact your admin</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
